<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jyoti Bindi — QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8e4d4;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-start;
      font-family: 'Rajdhani', sans-serif;
      padding: 40px 20px 60px; min-height: 100vh;
    }

    .print-btn {
      margin-bottom: 20px; padding: 12px 32px;
      background: #c01010; color: #fff8e0;
      border: none; border-radius: 10px;
      font-family: 'Cinzel', serif; font-size: .75rem; font-weight: 700;
      letter-spacing: .08em; cursor: pointer;
      box-shadow: 0 4px 16px rgba(192,16,16,.4);
    }

    .card {
      position: relative; width: 380px; border-radius: 20px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      background: #0a0800;
      box-shadow: 0 8px 40px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
    }

    /* Yellow-gold header */
    .header-block {
      width: 100%;
      background: linear-gradient(160deg, #3a2800 0%, #1a1000 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 26px 20px;
      border-bottom: 2px solid rgba(212,184,0,0.3);
    }

    .logo-border {
      width: 110px; height: 110px;
      background: #d4b800;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 2px 16px rgba(212,184,0,.4), 0 0 0 3px rgba(212,184,0,0.25);
      padding: 6px;
    }
    .logo-img { width: 98px; height: 98px; object-fit: contain; }

    h1 {
      font-family: 'Cinzel', serif; font-size: 1.7rem; font-weight: 900;
      letter-spacing: .06em; text-align: center; line-height: 1.2;
      background: linear-gradient(180deg, #ffffff 0%, #f0d400 50%, #d4b800 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 3px;
    }

    .tagline {
      font-size: .6rem; color: rgba(255,255,255,.45);
      letter-spacing: .2em; text-transform: uppercase; margin-bottom: 8px;
    }

    .group-pill {
      background: rgba(212,184,0,.12); border: 1px solid rgba(212,184,0,.35);
      border-radius: 20px; padding: 3px 14px;
      font-size: .65rem; font-weight: 700; color: #f0d400;
      letter-spacing: .1em; text-transform: uppercase;
    }

    /* White body */
    .body-block {
      width: 100%; background: #ffffff;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 24px 0;
    }

    .scan-label {
      font-size: .62rem; color: #c01010; letter-spacing: .16em;
      text-transform: uppercase; margin-bottom: 12px; font-weight: 700;
    }

    .qr-wrap {
      background: #fff; border-radius: 14px; padding: 10px;
      border: 3px solid #c01010;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(192,16,16,.12);
    }

    .prizes-strip {
      display: flex; gap: 6px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 16px; width: 100%;
    }
    .prize-chip {
      background: #fffbe6; border: 1px solid rgba(212,184,0,.4);
      border-radius: 20px; padding: 3px 10px;
      font-size: .62rem; color: #7a5800;
      font-weight: 700; letter-spacing: .03em; white-space: nowrap;
    }

    .divider {
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, #d4b800, transparent);
      opacity: .5; margin-bottom: 14px;
    }

    /* Dark address block */
    .address-block {
      width: 100%; background: #c01010;
      padding: 12px 24px 11px; text-align: center;
    }
    .branch-name {
      font-family: 'Cinzel', serif; font-size: .9rem; font-weight: 700;
      color: #fff8e0; letter-spacing: .04em; margin-bottom: 3px;
    }
    .location { font-size: .65rem; color: rgba(255,255,255,.8); line-height: 1.6; }

    /* White footer */
    .footer-strip {
      width: 100%; background: #ffffff;
      border-top: 2px solid #d4b800;
      padding: 8px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-strip .dev { font-size: .58rem; color: #999; letter-spacing: .04em; }
    .footer-strip .dev span { color: #c01010; font-weight: 800; }
    .footer-strip .phone { font-size: .62rem; color: #c01010; font-weight: 700; }

    @page { size: 380px 680px; margin: 0; }
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html { width: 380px !important; }
      body { width: 380px !important; min-height: 680px !important; background: #e8e4d4 !important; margin: 0 !important; padding: 0 !important; display: block !important; }
      .print-btn { display: none !important; }
      .card { width: 380px !important; border-radius: 0 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <button class="print-btn" onclick="window.print()">⬇ Download PDF</button>

  <div class="card">

    <!-- DARK HEADER -->
    <div class="header-block">
      <div class="logo-border">
        <img class="logo-img" src="logo.png" alt="Jyoti Bindi"
          onerror="this.parentElement.innerHTML='🪔';" />
      </div>
      <h1>Jyoti Bindi</h1>
      <div class="tagline">Fancy &amp; Plain Bindies · Hyderabad</div>
      <div class="group-pill">Begum Bazar</div>
    </div>

    <!-- WHITE BODY -->
    <div class="body-block">
      <div class="scan-label">⬇ Scan &amp; Win Exciting Prizes ⬇</div>

      <div class="qr-wrap">
        <div id="qrcode"></div>
      </div>

      <div class="prizes-strip">
        <span class="prize-chip">🎫 Win 5% Discount on Your Purchase!</span>
      </div>

      <div class="divider"></div>
    </div>

    <!-- RED ADDRESS BLOCK -->
    <div class="address-block">
      <div class="branch-name">Jyoti Bindi — Begum Bazar</div>
      <div class="location">📍 #15-6-380, Pathanwadi Main Road<br>Khan Market, Begum Bazar, Hyderabad-500012</div>
    </div>

    <!-- WHITE FOOTER -->
    <div class="footer-strip">
      <div class="dev">Developed by <span>SEHIL</span></div>
      <div class="phone">📞 +91 91824 80974</div>
    </div>

  </div>

  <script>
    new QRCode(document.getElementById('qrcode'), {
      text: 'https://sehilinnovation.github.io/jyoti-bindi-game/',
      width: 220, height: 220,
      colorDark: '#0a0800', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
